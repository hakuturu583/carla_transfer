[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "carla-transfer"
version = "0.2.0"
description = "Real-time sim-to-real video generation for CARLA using OmniDreams / Cosmos3-Nano running in Docker"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "numpy>=1.26",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "grpcio>=1.60",
    "protobuf>=5.0",
    "httpx>=0.27",
    "roadgen>=0.1.0",
    "pyarrow>=25.0.1",
    "scipy>=1.15.3",
    "imageio>=2.34",
    "av>=12",
]

[project.optional-dependencies]
# Client-side helpers that are heavy or platform-specific.
# CARLA 0.10 ships its client as a wheel inside the server image
# (PythonAPI/carla/dist); install it with `uv pip install <wheel>`.
carla = []
display = ["opencv-python>=4.8"]
video = ["imageio>=2.34", "imageio-ffmpeg>=0.5"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "grpcio-tools>=1.60",
]

[project.scripts]
carla-transfer = "carla_transfer.cli:main"
carla-transfer-server = "carla_transfer.server.omnidreams_server:main"
carla-transfer-cosmos3 = "carla_transfer.server.cosmos3_transfer:main"

[tool.hatch.build.targets.wheel]
packages = ["src/carla_transfer"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Generated protobuf modules are not ours to lint.
exclude = ["src/carla_transfer/protos/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
