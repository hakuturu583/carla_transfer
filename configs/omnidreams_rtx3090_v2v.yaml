# OmniDreams video-to-video: each chunk's CARLA frames guide the rollout.
# Same as omnidreams_rtx3090.yaml plus `guide`. guide_mode x0 blends the
# first step's x0 estimate toward the CARLA latent (weight = how much CARLA
# survives) and the two remaining steps re-synthesise a coherent image;
# measured best at [1000, 450, 100] / 0.5 (475 ms per 8-frame chunk).
# guide_mode init (SDEdit start, e.g. denoising_steps [600, 100]) leaves
# artifacts that compound through the KV cache.
backend: omnidreams
width: 512
height: 288
fps: 30
docker:
  image: carla-transfer/omnidreams:latest
  container_name: carla-transfer-omnidreams
  startup_timeout_s: 1800
omnidreams:
  port: 50051
  frames_per_chunk: 8
  first_chunk_frames: 5
  manifest: example_world_model_rtx3090.yaml
  offload_text_encoder: true
  camera_name: camera_front_wide_120fov
  scene_archive: outputs/scenes/town10.usdz
  initial_image: archive
  guide: true
  denoising_steps: [1000, 450, 100]
  guide_mode: x0
  guide_weight: 0.5
  positive_prompt: >-
    Driving scene from a front-facing car camera. Urban environment with roads,
    vehicles, pedestrians, traffic signs, and buildings. Clear visibility,
    realistic lighting, photorealistic quality. High resolution dashcam footage.
